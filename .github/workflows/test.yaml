name: test

on: [pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - run: npm install
    - run: npm run lint --workspaces --if-present
    - run: npx tsc --noEmit --strict --lib es2022,dom packages/rtcstats-shared/index.d.ts
    - run: npx tsc --noEmit --strict --lib es2022,dom packages/rtcstats-features/index.d.ts
    - run: npx tsc --noEmit --strict --lib es2022,dom packages/rtcstats-node-shared/index.d.ts
    - run: npx tsc --noEmit --strict --lib es2022,dom packages/rtcstats-js/rtcstats.d.ts
  coverage-rtcstats-shared:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - run: npm install
    - run: npm run coverage --workspace=packages/rtcstats-shared
    - run: sed -i 's|^SF:\.\./|SF:packages/|; t; s|^SF:|SF:packages/rtcstats-shared/|' packages/rtcstats-shared/coverage/lcov.info
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: packages/rtcstats-shared/coverage/lcov.info
        disable_search: true
  coverage-rtcstats-server:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - run: npm install
    - run: npm run coverage --workspace=packages/rtcstats-server
    - run: sed -i 's|^SF:\.\./|SF:packages/|; t; s|^SF:|SF:packages/rtcstats-server/|' packages/rtcstats-server/coverage/lcov.info
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: packages/rtcstats-server/coverage/lcov.info
        disable_search: true
  coverage-rtcstats-features:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - run: npm install
    - run: npm run coverage --workspace=packages/rtcstats-features
    - run: sed -i 's|^SF:\.\./|SF:packages/|; t; s|^SF:|SF:packages/rtcstats-features/|' packages/rtcstats-features/coverage/lcov.info
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: packages/rtcstats-features/coverage/lcov.info
        disable_search: true
  coverage-rtcstats-node-shared:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - run: npm install
    - run: npm run coverage --workspace=packages/rtcstats-node-shared
    - run: sed -i 's|^SF:\.\./|SF:packages/|; t; s|^SF:|SF:packages/rtcstats-node-shared/|' packages/rtcstats-node-shared/coverage/lcov.info
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: packages/rtcstats-node-shared/coverage/lcov.info
        disable_search: true
  coverage-dump-importer:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - run: npm install
    - run: npm run coverage --workspace=dump-importer
  coverage-rtcstats-js:
    # This needs 22.04, see https://github.com/webrtc/samples/issues/1692
    runs-on: ubuntu-22.04
    needs: lint
    strategy:
      matrix:
        browser: [chrome]
        version: [stable]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - run: npm install
    - run: sudo rm /usr/bin/chromedriver # remove preinstalled github chromedriver from $PATH
    - run: Xvfb :99 &
    - run: BROWSER=${{matrix.browser}} BVER=${{matrix.version}} DISPLAY=:99.0 npm run coverage --workspace=packages/rtcstats-js
    - run: sed -i 's|^SF:\.\./|SF:packages/|; t; s|^SF:|SF:packages/rtcstats-js/|' packages/rtcstats-js/coverage/lcov.info
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: packages/rtcstats-js/coverage/lcov.info
        disable_search: true
